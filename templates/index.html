<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>URL Parameter Checker</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 16px 80px;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }
    header h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #fff;
    }
    header p {
      margin-top: 8px;
      color: #94a3b8;
      font-size: 0.95rem;
    }
    .version {
      margin-top: 6px;
      font-size: 0.75rem;
      color: #475569;
    }

    .card {
      background: #1e2130;
      border: 1px solid #2d3348;
      border-radius: 14px;
      padding: 28px;
      width: 100%;
      max-width: 720px;
    }

    .input-row {
      display: flex;
      gap: 10px;
    }
    .input-row input {
      flex: 1;
      background: #0f1117;
      border: 1px solid #2d3348;
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 0.95rem;
      color: #e2e8f0;
      outline: none;
      transition: border-color 0.2s;
    }
    .input-row input:focus { border-color: #6366f1; }
    .input-row input::placeholder { color: #475569; }

    button {
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 12px 22px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, opacity 0.2s;
      white-space: nowrap;
    }
    button:hover { background: #4f46e5; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    #loading {
      display: none;
      margin-top: 24px;
      text-align: center;
      color: #94a3b8;
      font-size: 0.9rem;
    }
    .loader {
      display: inline-block;
      width: 18px; height: 18px;
      border: 2px solid #334155;
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #results { margin-top: 28px; display: none; }

    .baseline-bar {
      background: #161926;
      border: 1px solid #2d3348;
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 20px;
    }
    .baseline-bar span { color: #e2e8f0; font-weight: 600; }

    .param-list { display: flex; flex-direction: column; gap: 10px; }

    .param-item {
      background: #161926;
      border: 1px solid #2d3348;
      border-radius: 10px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      animation: fadeIn 0.2s ease both;
    }
    .param-item:nth-child(1)  { animation-delay: 0.00s; }
    .param-item:nth-child(2)  { animation-delay: 0.05s; }
    .param-item:nth-child(3)  { animation-delay: 0.10s; }
    .param-item:nth-child(4)  { animation-delay: 0.15s; }
    .param-item:nth-child(5)  { animation-delay: 0.20s; }
    .param-item:nth-child(6)  { animation-delay: 0.25s; }
    .param-item:nth-child(7)  { animation-delay: 0.30s; }
    .param-item:nth-child(8)  { animation-delay: 0.35s; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .dot.required { background: #f87171; }
    .dot.optional { background: #4ade80; }

    .param-name {
      font-family: "Fira Code", "Cascadia Code", monospace;
      font-size: 0.9rem;
      color: #c7d2fe;
      flex: 1;
      word-break: break-all;
    }

    .param-meta {
      font-size: 0.78rem;
      color: #64748b;
      text-align: right;
      min-width: 120px;
    }

    .param-link {
      color: #6366f1;
      text-decoration: none;
      font-size: 0.82rem;
      flex-shrink: 0;
      transition: color 0.2s;
    }
    .param-link:hover { color: #818cf8; }

    .badge {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 20px;
      min-width: 78px;
      text-align: center;
    }
    .badge.required { background: #450a0a; color: #f87171; border: 1px solid #7f1d1d; }
    .badge.optional { background: #052e16; color: #4ade80; border: 1px solid #14532d; }

    #summary {
      margin-top: 24px;
      border-top: 1px solid #2d3348;
      padding-top: 20px;
    }
    #summary h3 { font-size: 0.85rem; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 14px; }

    .summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .summary-box {
      border-radius: 10px;
      padding: 16px;
    }
    .summary-box.required-box { background: #1c0a0a; border: 1px solid #7f1d1d; }
    .summary-box.optional-box { background: #021a0e; border: 1px solid #14532d; }
    .summary-box h4 { font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; }
    .summary-box.required-box h4 { color: #f87171; }
    .summary-box.optional-box h4 { color: #4ade80; }
    .summary-box ul { list-style: none; display: flex; flex-direction: column; gap: 6px; }
    .summary-box li {
      font-family: "Fira Code", monospace;
      font-size: 0.85rem;
      color: #cbd5e1;
      background: #0f1117;
      border-radius: 6px;
      padding: 5px 10px;
    }
    .summary-box .empty { font-size: 0.82rem; color: #475569; font-style: italic; }

    #error-msg {
      display: none;
      background: #1c0a0a;
      border: 1px solid #7f1d1d;
      color: #f87171;
      border-radius: 8px;
      padding: 12px 16px;
      margin-top: 16px;
      font-size: 0.88rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>URL Parameter Checker</h1>
    <p>Find out which query parameters are required and which are optional.</p>
    <div class="version">v1.4.0</div>
  </header>

  <div class="card">
    <div class="input-row">
      <input id="url-input" type="url"
        placeholder="https://example.com/search?q=hello&lang=en&page=1" />
      <button id="check-btn" onclick="runCheck()">Check</button>
    </div>

    <div id="error-msg"></div>

    <div id="loading">
      <span class="loader"></span>
      <span id="loading-text">Checking parameters…</span>
    </div>

    <div id="results">
      <div class="baseline-bar" id="baseline-bar"></div>
      <div class="param-list" id="param-list"></div>
      <div id="summary">
        <h3>Summary</h3>
        <div class="summary-grid">
          <div class="summary-box required-box">
            <h4>Required</h4>
            <ul id="summary-required"></ul>
          </div>
          <div class="summary-box optional-box">
            <h4>Optional</h4>
            <ul id="summary-optional"></ul>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    function showError(msg) {
      const el = document.getElementById("error-msg");
      el.textContent = msg;
      el.style.display = "block";
    }
    function clearError() {
      document.getElementById("error-msg").style.display = "none";
    }
    function fmtBytes(n) {
      if (n == null) return "—";
      return n < 1024 ? `${n} B` : `${(n / 1024).toFixed(1)} KB`;
    }
    function escHtml(str) {
      return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    }

    async function runCheck() {
      const url = document.getElementById("url-input").value.trim();
      if (!url) { showError("Please enter a URL."); return; }

      clearError();
      document.getElementById("results").style.display = "none";
      document.getElementById("param-list").innerHTML = "";
      document.getElementById("check-btn").disabled = true;
      document.getElementById("loading").style.display = "block";
      document.getElementById("loading-text").textContent = "Checking parameters…";

      try {
        const res = await fetch("/check", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url }),
        });

        const data = await res.json();

        if (!res.ok) {
          showError(data.error || "Something went wrong.");
          return;
        }

        // Baseline bar
        document.getElementById("baseline-bar").innerHTML =
          `Baseline &mdash; HTTP <span>${data.baseline.status}</span> · <span>${fmtBytes(data.baseline.size)}</span>`;

        // Parameter rows
        const list = document.getElementById("param-list");
        data.results.forEach(({ param, verdict, status, size, error, test_url }) => {
          const meta = error ? "request failed" : `HTTP ${status} · ${fmtBytes(size)}`;
          const div = document.createElement("div");
          div.className = "param-item";
          div.innerHTML = `
            <div class="dot ${verdict}"></div>
            <div class="param-name">${escHtml(param)}</div>
            <div class="param-meta">${meta}</div>
            <div class="badge ${verdict}">${verdict === "required" ? "Required" : "Optional"}</div>
            <a class="param-link" href="${escHtml(test_url)}" target="_blank" rel="noopener" title="Open test URL">&#x2197;</a>
          `;
          list.appendChild(div);
        });

        // Summary
        const sumReq = document.getElementById("summary-required");
        const sumOpt = document.getElementById("summary-optional");
        sumReq.innerHTML = data.required.length
          ? data.required.map(p => `<li>${escHtml(p)}</li>`).join("")
          : `<li class="empty">none</li>`;
        sumOpt.innerHTML = data.optional.length
          ? data.optional.map(p => `<li>${escHtml(p)}</li>`).join("")
          : `<li class="empty">none</li>`;

        document.getElementById("results").style.display = "block";

      } catch (e) {
        showError("Network error. Please try again.");
      } finally {
        document.getElementById("loading").style.display = "none";
        document.getElementById("check-btn").disabled = false;
      }
    }

    document.getElementById("url-input").addEventListener("keydown", (e) => {
      if (e.key === "Enter") runCheck();
    });
  </script>
</body>
</html>
