<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Supplier Database Access</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f4f6f9;
      color: #1a1a2e;
      min-height: 100vh;
    }
    header {
      background: #16213e;
      color: #fff;
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    header h1 { font-size: 1.4rem; font-weight: 600; }
    .badge {
      background: #0f3460;
      border: 1px solid #e94560;
      color: #e94560;
      border-radius: 4px;
      font-size: 0.7rem;
      padding: 2px 8px;
      text-transform: uppercase;
      letter-spacing: .05em;
    }
    main { max-width: 1100px; margin: 2rem auto; padding: 0 1rem; }

    /* toolbar */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: .75rem;
      margin-bottom: 1.5rem;
      align-items: center;
    }
    .toolbar input[type="search"], .toolbar select {
      padding: .45rem .75rem;
      border: 1px solid #cdd5df;
      border-radius: 6px;
      font-size: .9rem;
      background: #fff;
    }
    .toolbar input[type="search"] { flex: 1; min-width: 200px; }
    .btn {
      padding: .45rem 1rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: .9rem;
      font-weight: 500;
      transition: opacity .15s;
    }
    .btn:hover { opacity: .85; }
    .btn-primary { background: #e94560; color: #fff; }
    .btn-secondary { background: #0f3460; color: #fff; }
    .btn-sm { padding: .3rem .65rem; font-size: .8rem; }
    .btn-danger { background: #dc3545; color: #fff; }
    .btn-edit { background: #0f3460; color: #fff; }

    /* table */
    .card { background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.08); overflow: hidden; }
    table { width: 100%; border-collapse: collapse; }
    thead th {
      background: #16213e;
      color: #cdd5df;
      padding: .7rem 1rem;
      text-align: left;
      font-size: .8rem;
      text-transform: uppercase;
      letter-spacing: .05em;
    }
    tbody tr { border-bottom: 1px solid #eef0f4; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: #f8f9fb; }
    td { padding: .65rem 1rem; font-size: .88rem; vertical-align: middle; }
    .pill {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 12px;
      font-size: .75rem;
      font-weight: 600;
    }
    .pill-active { background: #d4edda; color: #155724; }
    .pill-inactive { background: #f8d7da; color: #721c24; }
    .actions { display: flex; gap: .4rem; }
    .empty { text-align: center; padding: 3rem; color: #6c757d; }

    /* modal */
    .overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.5);
      display: flex; align-items: center; justify-content: center;
      z-index: 100;
      opacity: 0; pointer-events: none;
      transition: opacity .2s;
    }
    .overlay.open { opacity: 1; pointer-events: all; }
    .modal {
      background: #fff;
      border-radius: 10px;
      padding: 2rem;
      width: 100%;
      max-width: 520px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 8px 32px rgba(0,0,0,.2);
      transform: translateY(10px);
      transition: transform .2s;
    }
    .overlay.open .modal { transform: translateY(0); }
    .modal h2 { margin-bottom: 1.25rem; font-size: 1.1rem; }
    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; margin-bottom: .35rem; font-size: .85rem; font-weight: 500; }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      padding: .45rem .75rem;
      border: 1px solid #cdd5df;
      border-radius: 6px;
      font-size: .9rem;
      font-family: inherit;
    }
    .form-group textarea { min-height: 80px; resize: vertical; }
    .modal-footer { display: flex; justify-content: flex-end; gap: .5rem; margin-top: 1.25rem; }
    .toast {
      position: fixed;
      bottom: 1.5rem; right: 1.5rem;
      background: #16213e;
      color: #fff;
      padding: .75rem 1.25rem;
      border-radius: 6px;
      font-size: .88rem;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity .3s, transform .3s;
      z-index: 200;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast.error { background: #dc3545; }
  </style>
</head>
<body>
  <header>
    <h1>Supplier Database Access</h1>
    <span class="badge">Feature</span>
  </header>

  <main>
    <div class="toolbar">
      <input type="search" id="searchInput" placeholder="Search by name, contact, or email…" />
      <select id="statusFilter">
        <option value="">All statuses</option>
        <option value="active">Active</option>
        <option value="inactive">Inactive</option>
      </select>
      <select id="categoryFilter">
        <option value="">All categories</option>
      </select>
      <button class="btn btn-primary" id="newBtn">+ New Supplier</button>
    </div>

    <div class="card">
      <table id="supplierTable">
        <thead>
          <tr>
            <th>Name</th>
            <th>Contact</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Category</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="supplierBody">
          <tr><td colspan="7" class="empty">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <!-- Add / Edit modal -->
  <div class="overlay" id="overlay">
    <div class="modal">
      <h2 id="modalTitle">New Supplier</h2>
      <form id="supplierForm" autocomplete="off">
        <input type="hidden" id="supplierId" />
        <div class="form-group">
          <label for="fName">Name *</label>
          <input type="text" id="fName" required />
        </div>
        <div class="form-group">
          <label for="fContact">Contact Name</label>
          <input type="text" id="fContact" />
        </div>
        <div class="form-group">
          <label for="fEmail">Email</label>
          <input type="email" id="fEmail" />
        </div>
        <div class="form-group">
          <label for="fPhone">Phone</label>
          <input type="tel" id="fPhone" />
        </div>
        <div class="form-group">
          <label for="fAddress">Address</label>
          <textarea id="fAddress"></textarea>
        </div>
        <div class="form-group">
          <label for="fCategory">Category</label>
          <input type="text" id="fCategory" placeholder="e.g. Raw Materials, Logistics…" />
        </div>
        <div class="form-group">
          <label for="fStatus">Status</label>
          <select id="fStatus">
            <option value="active">Active</option>
            <option value="inactive">Inactive</option>
          </select>
        </div>
        <div class="form-group">
          <label for="fNotes">Notes</label>
          <textarea id="fNotes"></textarea>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="cancelBtn">Cancel</button>
          <button type="submit" class="btn btn-primary" id="saveBtn">Save</button>
        </div>
      </form>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const API = '/api/suppliers';
    let suppliers = [];

    // --- helpers ---
    const overlay  = document.getElementById('overlay');
    const toast    = document.getElementById('toast');
    const tbody    = document.getElementById('supplierBody');

    function showToast(msg, isError = false) {
      toast.textContent = msg;
      toast.className = 'toast' + (isError ? ' error' : '');
      void toast.offsetWidth;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3000);
    }

    function openModal(supplier = null) {
      document.getElementById('supplierId').value  = supplier?.id ?? '';
      document.getElementById('fName').value        = supplier?.name ?? '';
      document.getElementById('fContact').value     = supplier?.contact_name ?? '';
      document.getElementById('fEmail').value       = supplier?.email ?? '';
      document.getElementById('fPhone').value       = supplier?.phone ?? '';
      document.getElementById('fAddress').value     = supplier?.address ?? '';
      document.getElementById('fCategory').value    = supplier?.category ?? '';
      document.getElementById('fStatus').value      = supplier?.status ?? 'active';
      document.getElementById('fNotes').value       = supplier?.notes ?? '';
      document.getElementById('modalTitle').textContent = supplier ? 'Edit Supplier' : 'New Supplier';
      overlay.classList.add('open');
    }

    function closeModal() { overlay.classList.remove('open'); }

    document.getElementById('newBtn').addEventListener('click', () => openModal());
    document.getElementById('cancelBtn').addEventListener('click', closeModal);
    overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });

    // --- render ---
    function renderTable(data) {
      if (!data.length) {
        tbody.innerHTML = '<tr><td colspan="7" class="empty">No suppliers found.</td></tr>';
        return;
      }
      tbody.innerHTML = data.map(s => `
        <tr>
          <td><strong>${esc(s.name)}</strong></td>
          <td>${esc(s.contact_name ?? '')}</td>
          <td>${s.email ? `<a href="mailto:${esc(s.email)}">${esc(s.email)}</a>` : ''}</td>
          <td>${esc(s.phone ?? '')}</td>
          <td>${esc(s.category ?? '')}</td>
          <td><span class="pill pill-${s.status}">${s.status}</span></td>
          <td>
            <div class="actions">
              <button class="btn btn-sm btn-edit"   onclick="editSupplier(${s.id})">Edit</button>
              <button class="btn btn-sm btn-danger" onclick="deleteSupplier(${s.id})">Delete</button>
            </div>
          </td>
        </tr>
      `).join('');
    }

    function esc(str) {
      return String(str)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;')
        .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function applyFilters() {
      const q   = document.getElementById('searchInput').value.toLowerCase();
      const st  = document.getElementById('statusFilter').value;
      const cat = document.getElementById('categoryFilter').value;
      const filtered = suppliers.filter(s =>
        (!q  || [s.name, s.contact_name, s.email].some(v => (v||'').toLowerCase().includes(q))) &&
        (!st  || s.status   === st) &&
        (!cat || s.category === cat)
      );
      renderTable(filtered);
    }

    function populateCategories() {
      const cats = [...new Set(suppliers.map(s => s.category).filter(Boolean))].sort();
      const sel  = document.getElementById('categoryFilter');
      const cur  = sel.value;
      sel.innerHTML = '<option value="">All categories</option>' +
        cats.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join('');
      if (cats.includes(cur)) sel.value = cur;
    }

    ['searchInput','statusFilter','categoryFilter'].forEach(id =>
      document.getElementById(id).addEventListener('input', applyFilters)
    );

    // --- API ---
    async function loadSuppliers() {
      try {
        const res = await fetch(API + '/');
        if (!res.ok) throw new Error(await res.text());
        suppliers = await res.json();
        populateCategories();
        applyFilters();
      } catch (e) {
        showToast('Failed to load suppliers: ' + e.message, true);
      }
    }

    window.editSupplier = async function(id) {
      const s = suppliers.find(x => x.id === id);
      if (s) openModal(s);
    };

    window.deleteSupplier = async function(id) {
      const s = suppliers.find(x => x.id === id);
      if (!confirm(`Delete supplier "${s?.name}"?`)) return;
      try {
        const res = await fetch(`${API}/${id}`, { method: 'DELETE' });
        if (!res.ok) throw new Error((await res.json()).error);
        showToast('Supplier deleted.');
        await loadSuppliers();
      } catch (e) {
        showToast('Delete failed: ' + e.message, true);
      }
    };

    document.getElementById('supplierForm').addEventListener('submit', async e => {
      e.preventDefault();
      const id = document.getElementById('supplierId').value;
      const body = {
        name:         document.getElementById('fName').value.trim(),
        contact_name: document.getElementById('fContact').value.trim(),
        email:        document.getElementById('fEmail').value.trim(),
        phone:        document.getElementById('fPhone').value.trim(),
        address:      document.getElementById('fAddress').value.trim(),
        category:     document.getElementById('fCategory').value.trim(),
        status:       document.getElementById('fStatus').value,
        notes:        document.getElementById('fNotes').value.trim(),
      };
      const url    = id ? `${API}/${id}` : `${API}/`;
      const method = id ? 'PUT' : 'POST';
      try {
        const res = await fetch(url, {
          method,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        if (!res.ok) throw new Error((await res.json()).error);
        showToast(id ? 'Supplier updated.' : 'Supplier created.');
        closeModal();
        await loadSuppliers();
      } catch (e) {
        showToast('Save failed: ' + e.message, true);
      }
    });

    loadSuppliers();
  </script>
</body>
</html>
